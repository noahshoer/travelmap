name: Build and publish Home Assistant app image

# Builds the TravelMap Home Assistant App image (home-assistant/travelmap/Dockerfile)
# and pushes it to GHCR under the name config.yaml's `image:` field expects
# (ghcr.io/<owner>/{arch}-travelmap). Only aarch64 is built, matching
# config.yaml's `arch:` list.
#
# Requires this repo's Settings -> Actions -> General -> Workflow permissions
# to be set to "Read and write permissions" so GITHUB_TOKEN can push to GHCR.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "home-assistant/travelmap/**"
      - ".github/workflows/publish-ha-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read version from config.yaml
        run: |
          version=$(grep -m1 '^version:' home-assistant/travelmap/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: home-assistant/travelmap/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aarch64-travelmap:latest
            ghcr.io/${{ github.repository_owner }}/aarch64-travelmap:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aarch64-travelmap:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
