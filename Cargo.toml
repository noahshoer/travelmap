[package]
name = "travelmap"
version = "0.1.0"
edition = "2021"

[lib]
name = "travelmap"
path = "src/lib.rs"

[[bin]]
name = "travelmap"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
